version: v1.1.0
steps:
  - build:
      - -t
      - samform/docling-serve-cu124:git-submodule-5
      - -t
      - samform.azurecr.io/docling-serve-cu124:git-submodule-5
      - -f
      - Containerfile
      - --platform
      - linux/amd64
      - --build-arg
      - "UV_SYNC_EXTRA_ARGS=--no-group pypi --group cu124"
      - https://github.com/Samform/docling-serve.git#update-local-changes
    env:
      - "DOCKER_BUILDKIT=1"
  - push:
      - samform.azurecr.io/docling-serve-cu124:git-submodule-5

