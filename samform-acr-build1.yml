version: v1.1.0
steps:
  - build: > 
      -t samform/docling-serve-cu124:git-submodule-2 
      -t samform.azurecr.io/docling-serve-cu124:git-submodule-2 
      --build-arg "UV_SYNC_EXTRA_ARGS=--no-group pypi --group cu124"
      -f Containerfile 
      --platform linux/amd64 
      https://github.com/Samform/docling-serve.git#update-local-changes
    args:
      UV_SYNC_EXTRA_ARGS: "--no-group pypi --group cu124"
    env:
      - "DOCKER_BUILDKIT=1"
  - push:
      - samform.azurecr.io/docling-serve-cu124:git-submodule-2

